# Integração contínua: roda a suíte de testes na JVM (sem emulador) a cada push.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 17: mínimo exigido pelo Android Gradle Plugin e o mesmo do daemon local.
      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Cache das dependências e da distribuição do Gradle entre execuções.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Testes unitários (JVM)
        run: ./gradlew test
